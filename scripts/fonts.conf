<?xml version="1.0"?>
<!--
  Fontconfig configuration for the build-time image rasteriser only: build tooling
  that never reaches the published output.

  The font directory below is deliberately fontconfig's only font source. The site
  bundles its own families and the social image must be drawn from them, so a host
  that cannot read them fails loudly rather than quietly substituting a system face
  that looks plausible and is wrong.

  scripts/gen-assets.ts pins FONTCONFIG_FILE to this file's absolute path before
  loading sharp, because fontconfig reads that variable once per process (the
  build-time rasteriser decision, PA-3). A WOFF2 file is indexed only when the
  FreeType fontconfig links can decode it; that script's two-probe check detects the
  case where it cannot, and the remedy belongs there, not here. Families are never
  named, aliased or rewritten here, which keeps src/styles/theme.css the only source
  of type truth.
-->
<fontconfig>
  <!-- Relative to the working directory, which is the repository root for every npm script. -->
  <dir prefix="cwd">public/fonts</dir>

  <!-- Inside the repository's build root, so the cache never leaves the checkout or dist/. -->
  <cachedir prefix="cwd">.build/fontconfig-cache</cachedir>
</fontconfig>
